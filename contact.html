<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Contact MaiCareNow by email or phone, review frequently asked questions, or begin the free assessment.">
  <meta name="theme-color" content="#ffffff">
  <meta name="author" content="Lindsey Inc.">
  <title>Contact | MaiCareNow</title>

  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">

  <script src="https://tally.so/widgets/embed.js"></script>

  <style>
    .contact-page {
      width: 100%;
      background: #ffffff;
    }

    .contact-art-wrap {
      position: relative;
      width: min(960px, calc(100% - 32px));
      margin: 24px auto 0;
    }

    .contact-art-wrap img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 18px;
    }

    .contact-hotspot {
      position: absolute;
      z-index: 5;
      display: block;
      border-radius: 18px;
      background: transparent;
    }

    .contact-hotspot:hover {
      background: rgba(123, 52, 127, 0.08);
      box-shadow: inset 0 0 0 3px rgba(123, 52, 127, 0.30);
    }

    .contact-hotspot:focus-visible {
      outline: 3px solid rgba(23, 105, 210, 0.45);
      outline-offset: 4px;
    }

    /* Message Us card and laptop area inside contact.png */
    .message-hotspot {
      left: 50.5%;
      top: 37.5%;
      width: 24%;
      height: 27%;
    }

    .contact-actions {
      width: min(960px, calc(100% - 32px));
      margin: 16px auto 22px;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    .contact-actions a {
      min-height: 46px;
      padding: 11px 13px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #dce5ef;
      border-radius: 12px;
      color: #102b63;
      background: #f7f9fc;
      text-align: center;
      text-decoration: none;
      font-size: 14px;
      font-weight: 800;
      line-height: 1.3;
    }

    .contact-actions a:hover {
      color: #1769d2;
      border-color: rgba(23, 105, 210, 0.35);
    }

    .contact-actions .primary-action {
      color: #ffffff;
      border-color: transparent;
      background: #7b347f;
    }

    .contact-actions .primary-action:hover {
      color: #ffffff;
      background: #672b6b;
    }

    @media (max-width: 900px) {
      .contact-art-wrap,
      .contact-actions {
        width: min(760px, calc(100% - 24px));
      }

      .contact-actions {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 700px) {
      .contact-art-wrap {
        width: calc(100% - 16px);
        margin-top: 12px;
      }

      .contact-actions {
        width: calc(100% - 20px);
        margin: 12px auto 16px;
        grid-template-columns: 1fr;
        gap: 9px;
      }

      .contact-actions a {
        min-height: 42px;
        padding: 9px 11px;
        font-size: 13px;
      }

      .message-hotspot {
        left: 50%;
        top: 37%;
        width: 25%;
        height: 28%;
      }
    }
  </style>
</head>

<body data-page="contact">
  <a class="skip-link" href="#main-content">Skip to main content</a>

  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html" aria-label="MaiCareNow home">
        <span class="brand-mark" aria-hidden="true">♡</span>

        <span class="brand-copy">
          <span class="brand-name">
            <span class="brand-mai">Mai</span><span class="brand-care">Care</span><span class="brand-now">Now</span>
          </span>

          <span class="brand-tagline">
            Your trusted guide through life’s healthcare decisions.
          </span>
        </span>
      </a>

      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="primary-navigation">
        <span class="menu-label">Menu</span>
        <span class="menu-icon" aria-hidden="true"></span>
      </button>

      <nav id="primary-navigation" class="primary-nav" aria-label="Primary navigation">
        <a href="index.html">Home</a>
        <a href="how-it-works.html">How It Works</a>
        <a href="lower-prescription-costs.html">Lower Rx Costs</a>
        <a href="resources.html">Resources</a>
        <a href="about-mai.html">About Us</a>
      </nav>
    </div>
  </header>

  <main id="main-content" class="contact-page">
    <section class="contact-art-wrap" aria-label="Contact MaiCareNow">
      <img
        src="assets/illustrations/contact.png"
        alt="Illustrated MaiCareNow contact page with email, phone, message, address, privacy, and emergency information."
        fetchpriority="high">

      <a
        class="contact-hotspot message-hotspot tally-popup-trigger"
        href="https://tally.so/r/7RMJy9"
        aria-label="Open the MaiCareNow contact and assessment form"></a>
    </section>

    <nav class="contact-actions" aria-label="Contact actions">
      <a href="mailto:mai@maicarenow.com">Email MaiCareNow</a>
      <a href="tel:+18322485340">Call (832) 248-5340</a>
      <a href="faq.html">View FAQs</a>
      <a
        class="primary-action tally-popup-trigger"
        href="https://tally.so/r/7RMJy9">
        Start My Free Assessment
      </a>
    </nav>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <p>© 2026 MaiCareNow. All rights reserved.</p>

      <nav aria-label="Footer navigation">
        <a href="privacy.html">Privacy</a>
        <a href="contact.html" aria-current="page">Contact</a>
      </nav>
    </div>
  </footer>

  <script src="js/site.js"></script>

  <script>
    (() => {
      const FORM_ID = "7RMJy9";

      const openTallyPopup = (event) => {
        if (!window.Tally || typeof window.Tally.openPopup !== "function") {
          return;
        }

        event.preventDefault();

        window.Tally.openPopup(FORM_ID, {
          layout: "modal",
          width: 580,
          alignLeft: true,
          hideTitle: true,
          overlay: true,
          autoClose: 0
        });
      };

      document.querySelectorAll(".tally-popup-trigger").forEach((trigger) => {
        trigger.addEventListener("click", openTallyPopup);
      });
    })();
  </script>
</body>
</html>
