<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Contact MaiCareNow by email or phone, review frequently asked questions, or begin the free assessment.">
  <meta name="theme-color" content="#ffffff">
  <meta name="author" content="Lindsey Inc.">
  <title>Contact | MaiCareNow</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">

  <style>
    .story-page { width: 100%; overflow: hidden; background: #fff; }
    .story-page-art { width: min(var(--content-width), 100%); margin: 0 auto; }
    .story-page-art img { display: block; width: 100%; height: auto; }

    .contact-actions {
      width: min(1120px, calc(100% - 40px));
      margin: 18px auto 24px;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
    }

    .contact-actions a {
      min-height: 48px;
      padding: 12px 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #dce5ef;
      border-radius: 14px;
      color: #102b63;
      background: #f7f9fc;
      box-shadow: 0 8px 18px rgba(16, 43, 99, .06);
      text-align: center;
      text-decoration: none;
      font-size: 15px;
      font-weight: 800;
      line-height: 1.3;
    }

    .contact-actions a:hover {
      color: #1769d2;
      border-color: rgba(23, 105, 210, .35);
      transform: translateY(-1px);
    }

    .contact-actions a:focus-visible {
      outline: 3px solid rgba(23, 105, 210, .34);
      outline-offset: 4px;
    }

    .contact-actions .primary-action {
      color: #fff;
      border-color: transparent;
      background: #7b347f;
    }

    .contact-actions .primary-action:hover {
      color: #fff;
      background: #672b6b;
    }

    @media (max-width: 900px) {
      .contact-actions { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 700px) {
      .story-page-art { width: 100%; }
      .contact-actions {
        width: calc(100% - 24px);
        margin: 14px auto 18px;
        grid-template-columns: 1fr;
        gap: 10px;
      }
      .contact-actions a {
        min-height: 44px;
        padding: 10px 12px;
        font-size: 14px;
      }
    }
  </style>
</head>

<body data-page="contact">
  <a class="skip-link" href="#main-content">Skip to main content</a>

    <div class="header-inner">

        <span class="brand-copy">

            <span class="brand-mai">Mai</span><span class="brand-care">Care</span><span class="brand-now">Now</span>
          </span>

        </span>
      </a>

      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="primary-navigation">
        <span class="menu-label">Menu</span>
        <span class="menu-icon" aria-hidden="true"></span>
      </button>

      <nav id="primary-navigation" class="primary-nav" aria-label="Primary navigation">
        <a href="index.html">Home</a>
        <a href="how-it-works.html">How It Works</a>
        <a href="lower-prescription-costs.html">Lower Rx Costs</a>
        <a href="resources.html">Resources</a>
        <a href="about-mai.html">About Us</a>
      </nav>
    </div>
  </header>

  <main id="main-content">
    <section class="story-page" aria-label="Contact MaiCareNow">

          fetchpriority="high">
      </div>

  <footer class="site-footer">

</html>
