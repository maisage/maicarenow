<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MaiCareNow</title>

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background-color: #f8fafc;
      color: #1f2937;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 80px 24px;
      text-align: center;
    }

    h1 {
      font-size: 2.2rem;
      line-height: 1.3;
      margin-bottom: 16px;
      font-weight: 600;
    }

    p {
      font-size: 1.1rem;
      margin-bottom: 28px;
      color: #4b5563;
    }

    .button {
      display: inline-block;
      padding: 14px 24px;
      background-color: #2563eb;
      color: #ffffff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      transition: background 0.2s ease;
    }

    .button:hover {
      background-color: #1d4ed8;
    }

    .trust {
      margin-top: 24px;
      font-size: 0.9rem;
      color: #6b7280;
    }
  </style>
</head>

<body>
  <main class="container">
    
    <h1>
      Need help figuring out care for a parent or loved one—right now?
    </h1>

    <p>
      Answer a few simple questions and get clear next steps in minutes—so you know exactly what to do.
    </p>

    <a class="button" href="#">
      Start here
    </a>

    <div class="trust">
      Built by someone who has personally navigated caregiving and complex systems.
    </div>

  </main>
</body>
</html>
