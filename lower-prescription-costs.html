<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lower Prescription Costs | MaiCareNow</title>
  <meta name="description" content="Find prescription savings options and support through MaiCareNow." />
  <link rel="stylesheet" href="styles.css" />

  <style>
    /* Page-specific navigation fix.
       This removes the unreliable top-image hotspot navigation and gives
       this page real links that work consistently on desktop, iPad, and mobile. */

    .page-shell {
      width: min(100%, 1536px);
      margin: 0 auto;
      background: var(--cream, #fff8ed);
    }

    .page-nav {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      padding: 16px 18px 10px;
      font-family: Arial, Helvetica, sans-serif;
    }

    .page-nav a {
      background: #ffffff;
      border: 1px solid var(--line, #e8dccb);
      border-radius: 999px;
      padding: 10px 14px;
      text-decoration: none;
      font-weight: 800;
      color: var(--navy, #123456);
      box-shadow: 0 6px 14px rgba(18, 52, 86, 0.06);
    }

    .page-nav a:hover,
    .page-nav a:focus {
      background: var(--soft, #eef8f5);
      outline: 2px solid var(--teal, #159d9a);
      outline-offset: 2px;
    }

    .page-nav .assessment-link {
      background: var(--coral, #ff6f59);
      color: #ffffff;
      border-color: var(--coral, #ff6f59);
    }

    .art-wrap {
      position: relative;
      width: 100%;
      margin: 0 auto;
    }

    .page-art {
      display: block;
      width: 100%;
      height: auto;
      border: 0;
    }

    .hotspot {
      position: absolute;
      display: block;
      text-indent: -9999px;
      overflow: hidden;
      border-radius: 12px;
      z-index: 5;
    }

    .hotspot:hover {
      background: rgba(21, 157, 154, 0.08);
    }

    .hotspot:focus-visible {
      outline: 4px solid var(--coral, #ff6f59);
      outline-offset: 3px;
      background: rgba(255, 255, 255, 0.85);
      text-indent: 0;
      padding: 6px;
      color: var(--navy, #123456);
      font-weight: 700;
      overflow: visible;
    }

    /* Keep only the meaningful image-based links. */
    .cta-main {
      left: 57%;
      top: 90%;
      width: 26%;
      height: 4.5%;
      border-radius: 999px;
    }

    .privacy {
      left: 42%;
      top: 97.5%;
      width: 8%;
      height: 1.7%;
    }

    .terms {
      left: 51%;
      top: 97.5%;
      width: 8%;
      height: 1.7%;
    }

    .page-footer {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      padding: 20px 18px 28px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 14px;
      color: var(--navy, #123456);
    }

    .page-footer a {
      color: inherit;
      text-decoration: none;
      font-weight: 700;
    }

    .page-footer a:hover {
      text-decoration: underline;
    }

    @media (max-width: 760px) {
      .page-nav {
        justify-content: flex-start;
        overflow-x: auto;
        flex-wrap: nowrap;
        padding: 14px;
      }

      .page-nav a {
        white-space: nowrap;
      }

      .cta-main {
        left: 12%;
        top: 88%;
        width: 76%;
        height: 6%;
      }

      .privacy,
      .terms {
        display: none;
      }
    }
  </style>
</head>

        Start My Free Assessment

      <a class="hotspot privacy" href="privacy.html">Privacy Policy</a>
