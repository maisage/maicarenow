  <style>
    .story-page {
      width: 100%;
      overflow: hidden;
      background: #ffffff;
    }

    .story-page-art {
      width: min(var(--content-width), 100%);
      margin: 0 auto;
    }

    .story-page-art img {
      display: block;
      width: 100%;
      height: auto;
    }

    .assessment-link {
      width: min(1120px, calc(100% - 40px));
      margin: 14px auto 18px;
      display: flex;
      justify-content: center;
    }

    .assessment-link a {
      min-height: 44px;
      padding: 10px 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border-radius: 999px;
      color: #ffffff;
      background: #7b347f;
      box-shadow: 0 7px 16px rgba(123, 52, 127, 0.18);
      text-decoration: none;
      font-size: 15px;
      font-weight: 800;
    }

    .assessment-link a:hover {
      background: #672b6b;
    }

    .assessment-link a:focus-visible {
      outline: 3px solid rgba(23, 105, 210, 0.34);
      outline-offset: 4px;
    }

    @media (max-width: 700px) {
      .story-page-art {
        width: 100%;
      }

      .assessment-link {
        width: calc(100% - 24px);
        margin: 12px auto 14px;
      }

      .assessment-link a {
        width: 100%;
        min-height: 42px;
        padding: 9px 16px;
        font-size: 14px;
      }
    }
  </style>
</head>
